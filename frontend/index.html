<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>
        <p class="subtitle">Fast and simple currency conversion</p>

        <div class="converter">

            <div class="input-group">
                <label>Amount</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    value="100"
                >
            </div>

            <div class="currency-row">

                <div class="input-group">
                    <label>From</label>

                    <select id="fromCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                    </select>
                </div>

                <button id="swapButton" class="swap-button">
                    ⇄
                </button>

                <div class="input-group">
                    <label>To</label>

                    <select id="toCurrency">
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                    </select>
                </div>

            </div>

            <button id="convertButton" class="convert-button">
                Convert
            </button>

            <div id="result" class="result">
                Enter an amount and click Convert
            </div>

        </div>


        <div class="section">

            <div class="section-header">
                <h2>Favorites</h2>
                <button id="addFavoriteButton">
                    ☆ Add Favorite
                </button>
            </div>

            <div id="favorites">
                <p class="empty-message">
                    No favorite currencies yet.
                </p>
            </div>

        </div>


        <div class="section">

            <h2>Recent Conversions</h2>

            <div id="history">

                <p class="empty-message">
                    No conversion history yet.
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
